name: merxen-gaston
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.23.5
  - pytorch=2.0.1
  - pytorch-cuda=11.8
  # Keep the CUDA metapackage on the ABI requested by PyTorch. Without this
  # explicit pin, newer NVIDIA repodata can resolve an unrelated CUDA version.
  - cuda-version=11.8
  # PyTorch 2.0.1 references Intel's iJIT profiling symbols. MKL >=2024.1
  # removed those symbols, causing torch imports to fail in CPU postprocessing.
  - mkl=2024.0.0
  # SpatialData 0.2.x still imports pkg_resources, which was removed from newer
  # setuptools releases. Keep the compatibility module available for the
  # Scanpy/Squidpy stack bundled in this environment.
  - setuptools=80.9.0
  - pip
  - pip:
      - gaston-spatial @ git+https://github.com/raphael-group/GASTON.git@79577c45111b3442b808c8e620711b822965493b
      - glmpca==0.1.0
      - kneed==0.8.5
      - scanpy==1.9.5
      - squidpy==1.3.1
      # SpatialData 0.2.x disables dask-expr; Dask 2025+ removed the legacy
      # dataframe backend entirely.
      - "dask[array,dataframe]>=2024.4.1,<2025"
      - anndata==0.9.2
      - matplotlib==3.8.0
      - pandas==2.1.1
      - pyarrow>=15,<24
      - scikit-learn==1.3.1
      - scipy==1.11.2
      - seaborn==0.12.2
      - statsmodels==0.14.0
      - psutil>=5.9
      - pydantic>=2.0
      - pydantic-settings>=2.0
      - tqdm==4.66.1
