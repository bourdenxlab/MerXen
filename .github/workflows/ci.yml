name: CI
on:
  push:
    # feature/robust-celltype-annotation: the integration branch of
    # docs/plans/robust-celltype-annotation-plan.md (§2.2), gated like main.
    branches: [main, feature/robust-celltype-annotation]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: |
          uv pip install --system -r requirements/requirements.lock
          uv pip install --system -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src/
      # nf-metro comes from the dev extra in the lockfile, as in the pre-push venv.
      - name: Metro map
        run: nf-metro validate assets/metro_map.mmd
      - name: Tests
        run: pytest -m "not slow"
