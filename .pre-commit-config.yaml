repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  # Must match the pinned ruff in pyproject.toml and requirements.lock. This
  # hook rewrites files on commit, so a mismatch against the version
  # scripts/run_ci_checks.sh checks with on push makes commits unpushable.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: local-ci
        name: local CI checks
        entry: scripts/run_ci_checks.sh
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
